# NVIDIA API Key Secret — 템플릿. 적용 전 REPLACE_ 값을 실제 키로 교체하되,
# 실제 키가 들어간 파일은 절대 커밋하지 말 것. 권장 생성법:
# kubectl create secret generic nvidia-api-key \
#   --from-literal=api-key="$NVIDIA_API_KEY" \
#   --from-literal=smithery-key="$SMITHERY_API_KEY" \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: nvidia-api-key
type: Opaque
stringData:
  api-key: "REPLACE_WITH_NVIDIA_API_KEY"
  smithery-key: "REPLACE_WITH_SMITHERY_API_KEY"
